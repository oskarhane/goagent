apiVersion: v1
kind: ServiceAccount
metadata:
  name: goagent
  labels:
    app: goagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: goagent-reader
  labels:
    app: goagent
rules:
# Core resources
- apiGroups: [""]
  resources:
  - pods
  - services
  - configmaps
  - endpoints
  - events
  - namespaces
  verbs:
  - get
  - list
  - watch
# Apps resources
- apiGroups: ["apps"]
  resources:
  - deployments
  - replicasets
  - statefulsets
  - daemonsets
  verbs:
  - get
  - list
  - watch
# Batch resources
- apiGroups: ["batch"]
  resources:
  - jobs
  - cronjobs
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: goagent-reader-binding
  labels:
    app: goagent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: goagent-reader
subjects:
- kind: ServiceAccount
  name: goagent
  # namespace inherited from metadata
---
