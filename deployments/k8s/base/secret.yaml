# Secret template - DO NOT commit with actual values
# Create secrets using kubectl or your secret management tool
apiVersion: v1
kind: Secret
metadata:
  name: goagent-secrets
  labels:
    app: goagent
type: Opaque
stringData:
  # OpenAI configuration
  openai_api_key: ""  # Your OpenAI API key
  
  # Google Cloud / Vertex AI configuration
  google_project_id: ""  # Your GCP project ID
  google_credentials: ""  # Service account JSON key (entire file content)
  
  # Example usage:
  # kubectl create secret generic goagent-secrets \
  #   --from-literal=openai_api_key=sk-... \
  #   --from-literal=google_project_id=my-project \
  #   --from-file=google_credentials=./key.json
