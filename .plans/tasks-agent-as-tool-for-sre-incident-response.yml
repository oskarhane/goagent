    title: "Implement coordinator agent setup"
    description: |
      Create main.go with coordinator agent configuration. Coordinator has system prompt for SRE triage/routing, access to investigate_service tool (wrapping investigator), and max 10 iterations. Use openai.NewProvider with gpt-5.1 model. Include logger setup with debug mode via DEBUG env var.
    status: pending
    dependencies:
      - task-005
    acceptance_criteria:
      - "main.go initializes OpenAI provider with API key from env"
      - "Coordinator agent created with triage system prompt"
      - "investigate_service tool registered to coordinator"
      - "Logger configured with Info/Debug levels"
      - "Max iterations set to 10"
    completed_at: null

