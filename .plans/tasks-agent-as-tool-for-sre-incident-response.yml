  - id: task-004
    title: "Implement investigator agent factory"
    description: |
      Create investigator.go with NewInvestigator() function that returns an agent configured for service-level investigation. Agent should have dynamic system prompt including service name, access to mock tools (logs, metrics, status), and max 5 iterations. Follow agent.NewAgent patterns from pkg/agent.
    status: pending
    dependencies:
      - task-002
    acceptance_criteria:
      - "NewInvestigator(serviceName, registry) function created"
      - "System prompt dynamically includes service name"
      - "Agent configured with mock tools registry"
      - "Max iterations set to 5"
      - "Returns *agent.Agent and error"
    completed_at: null

  - id: task-005
    title: "Create agent-as-tool wrapper for investigator"
    description: |
      Implement the core pattern: wrap investigator agent as a tool callable by coordinator. Create investigate_service tool using tools.Builder with service_name and incident_type params. Handler runs inner agent with scoped context and returns agent response as ToolResult. Implement proper error propagation from inner agent.
    status: pending
    dependencies:
      - task-004
    acceptance_criteria:
      - "investigate_service tool created with Builder pattern"
      - "Handler parses service_name and incident_type params"
      - "Handler creates investigator agent with service scope"
      - "Handler runs agent.Run() and converts result to ToolResult"
      - "Inner agent errors propagate cleanly to outer agent"
    completed_at: null

