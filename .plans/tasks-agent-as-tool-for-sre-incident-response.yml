      - "Data is deterministic for reproducible demos"
    completed_at: null

  - id: task-003
    title: "Create incident scenarios with cascading failures"
    description: |
      Implement scenarios.go with pre-built incident scenarios demonstrating cascading failures (auth → api → user-facing errors). Include scenario data structures and factory functions that return incident descriptions and expected mock data for services: api-service, database, cache, auth-service.
    status: pending
    dependencies:
      - task-002
    acceptance_criteria:
      - "Scenarios struct with multiple incident types defined"
